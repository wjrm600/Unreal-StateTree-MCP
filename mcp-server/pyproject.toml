[project]
name = "unreal-statetree-mcp"
version = "0.1.0"
description = "MCP server for authoring Unreal Engine StateTree assets"
requires-python = ">=3.10"
dependencies = ["mcp>=1.2.0"]

[project.scripts]
unreal-statetree-mcp = "statetree_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
